<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividades de Conjunto</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FFFFFF'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%23E8388A'/%3E%3Ccircle cx='32' cy='32' r='17.5' fill='%23FFFFFF'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23FFC933'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='%23FF3D5A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E1552; --violet:#6C3CE0; --sun:#FFC933; --mint:#2DD4A0; --paper:#F6F4FF;
    --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
    --text:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:var(--text);color:var(--ink);
    background:radial-gradient(circle at 78% 10%,#7B4DFF 0,transparent 46%),linear-gradient(140deg,#4B2BB8,#1E1552);
    padding:clamp(1.5rem,6vw,4rem)}
  h1{font-family:var(--display);font-weight:800;color:#fff;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 .4rem}
  p.lede{color:#E7E2FF;font-size:1.15rem;max-width:60ch;margin:0 0 2.4rem}
  .list{display:grid;gap:1.2rem;max-width:44rem}
  .card{display:flex;align-items:center;gap:1.2rem;background:var(--paper);border-radius:1.4rem;
    padding:1.3rem 1.6rem;text-decoration:none;color:var(--ink);box-shadow:0 .5rem 0 rgba(0,0,0,.2);transition:transform .15s}
  .card:hover{transform:translateY(-2px)}
  .num{flex:0 0 auto;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--violet);color:#fff;
    display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem}
  .meta{min-width:0}
  .meta h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.3rem}
  .meta span{font-size:.95rem;opacity:.75}
</style>
</head>
<body>
  <h1>Actividades de Conjunto</h1>
  <p class="lede">Material interactivo del Comité de Cafeteros para las actividades de conjunto.</p>
  <div class="list">
    <a class="card" href="actividad-1/">
      <span class="num">1</span>
      <span class="meta">
        <h2>Ojo al objetivo</h2>
        <span>28 de septiembre de 2026</span>
      </span>
    </a>
  </div>
</body>
</html>
